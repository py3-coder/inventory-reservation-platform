spring.application.name=fulfillment

spring.datasource.url=jdbc:postgresql://localhost:5432/fulfillment
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

app.jwt.secret=change-this-secret-key-to-a-long-random-value-for-local-development
app.jwt.expiration-ms=3600000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging.level.org.springframework.security=TRACE

payment.fake.outcome=SUCCESS
payment.fake.delay-seconds=5

app.reservation.ttl-seconds=600

reservation.expiry.scheduler-delay-ms=30000